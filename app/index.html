<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1311" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Ôn luyện từ vựng tiếng Anh với lịch ôn thông minh" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Từ vựng" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Ôn từ vựng</title>
    <script>
      // Áp giao diện và cỡ chữ đã chọn trước khi app chạy, để không nháy màu (giống lib/appearance.ts).
      try {
        var s = JSON.parse(localStorage.getItem('ui-settings') || '{}')
        var sizes = { small: '93.75%', normal: '100%', large: '112.5%', larger: '125%' }
        if (s.theme === 'light' || s.theme === 'dark') {
          document.documentElement.dataset.theme = s.theme
          var bar = s.theme === 'dark' ? '#0e1311' : '#f5f6f2'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = bar
          })
        }
        if (sizes[s.textSize]) document.documentElement.style.fontSize = sizes[s.textSize]
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
